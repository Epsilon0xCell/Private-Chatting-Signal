<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Side view of the shore in three bands: moon and bay above, seawater draining down stone steps in the middle, wet sand channels below">
  <rect width="1200" height="360" fill="#1a0f20"/>
  <!-- top band: moon, slow cloud, shimmering bay -->
  <rect y="0" width="1200" height="120" fill="#241631"/>
  <circle cx="880" cy="58" r="34" fill="#d8dce6"/>
  <g fill="#3a2a4e">
    <rect x="820" y="66" width="130" height="7" rx="3">
      <animate attributeName="x" values="812;838;812" dur="26s" repeatCount="indefinite"/>
    </rect>
    <rect x="836" y="78" width="96" height="5" rx="2">
      <animate attributeName="x" values="830;850;830" dur="26s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g stroke="#c9cfdb" stroke-width="3" stroke-linecap="round">
    <line x1="820" y1="104" x2="884" y2="104"><animate attributeName="x1" values="820;806;820" dur="7s" repeatCount="indefinite"/><animate attributeName="x2" values="884;898;884" dur="7s" repeatCount="indefinite"/></line>
    <line x1="842" y1="112" x2="928" y2="112"><animate attributeName="x1" values="842;856;842" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" values="928;914;928" dur="9s" repeatCount="indefinite"/></line>
    <line x1="806" y1="96" x2="852" y2="96"><animate attributeName="x1" values="806;818;806" dur="11s" repeatCount="indefinite"/><animate attributeName="x2" values="852;840;852" dur="11s" repeatCount="indefinite"/></line>
  </g>
  <!-- middle band: steps draining tread by tread, lantern, raven -->
  <rect y="120" width="1200" height="130" fill="#2c1d3d"/>
  <g fill="#4a3563">
    <rect x="120" y="218" width="150" height="32"/>
    <rect x="270" y="194" width="150" height="56"/>
    <rect x="420" y="170" width="150" height="80"/>
    <rect x="570" y="146" width="150" height="104"/>
  </g>
  <g fill="#d8dce6">
    <rect x="120" y="218" width="150" height="5"/>
    <rect x="270" y="194" width="150" height="5"/>
    <rect x="420" y="170" width="150" height="5"/>
    <rect x="570" y="146" width="150" height="5"/>
  </g>
  <g fill="#5d7fa6" opacity="0.85">
    <rect x="120" y="218" width="150" height="26">
      <animate attributeName="height" values="26;26;4;4" keyTimes="0;0.45;0.8;1" dur="18s" repeatCount="indefinite"/>
    </rect>
    <rect x="270" y="194" width="150" height="22">
      <animate attributeName="height" values="22;22;3;3" keyTimes="0;0.55;0.88;1" dur="18s" repeatCount="indefinite"/>
    </rect>
    <rect x="420" y="170" width="150" height="18">
      <animate attributeName="height" values="18;18;2;2" keyTimes="0;0.65;0.94;1" dur="18s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="806" y="140" width="7" height="110" fill="#0f0a14"/>
  <rect x="788" y="128" width="43" height="6" fill="#0f0a14"/>
  <rect x="802" y="134" width="15" height="19" fill="none" stroke="#d8dce6" stroke-width="2"/>
  <ellipse cx="809" cy="144" rx="3.4" ry="5" fill="#eef0f4">
    <animate attributeName="ry" values="5;4.2;5;4.6;5" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.82;1;0.9;1" dur="2.8s" repeatCount="indefinite"/>
  </ellipse>
  <g fill="#0a0710">
    <ellipse cx="782" cy="120" rx="11" ry="7"/>
    <g>
      <ellipse cx="790" cy="114" rx="5.5" ry="4.5"/>
      <path d="M795 113 L804 115 L795 117 Z"/>
      <animateTransform attributeName="transform" type="rotate" values="0 790 116;0 790 116;18 790 116;18 790 116;0 790 116" keyTimes="0;0.55;0.62;0.8;0.88" dur="14s" repeatCount="indefinite"/>
    </g>
    <path d="M772 122 L758 132 L774 128 Z"/>
  </g>
  <!-- bottom band: wet sand, channels filling, folded cloak on a post -->
  <rect y="250" width="1200" height="110" fill="#372a4a"/>
  <g stroke="#aab3bd" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M60 292 C 260 276, 420 306, 640 290 S 1020 282, 1140 296" opacity="0.35">
      <animate attributeName="opacity" values="0.35;0.35;0.9;0.9;0.35" keyTimes="0;0.4;0.75;0.92;1" dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M40 330 C 300 316, 560 342, 820 326 S 1080 320, 1160 332" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.3;0.8;0.8;0.3" keyTimes="0;0.5;0.82;0.95;1" dur="18s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x="986" y="262" width="7" height="66" fill="#0f0a14"/>
  <path d="M968 268 L1012 268 L1006 316 L974 316 Z" fill="#443257"/>
  <path d="M974 316 L1006 316 L1004 326 L976 326 Z" fill="#54406e">
    <animateTransform attributeName="transform" type="rotate" values="0 990 316;0 990 316;2.5 990 316;0 990 316" keyTimes="0;0.9;0.96;1" dur="18s" repeatCount="indefinite"/>
  </path>
</svg>
